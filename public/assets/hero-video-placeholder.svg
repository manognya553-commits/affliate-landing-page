<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="calmWarmGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="55%" stop-color="#F7EFE4" />
      <stop offset="100%" stop-color="#ECE2D2" />
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FED7AA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#F5EFE6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="personLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="personRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#calmWarmGrad)" />

  <!-- Morning Sunlight Ambient Glow -->
  <circle cx="250" cy="210" r="170" fill="url(#sunGlow)" />

  <!-- Serene Balcony Scene with Friendly Everyday Conversation -->
  <g transform="translate(250, 235)" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
    
    <!-- Soft Decorative Window / Arch Line in Background -->
    <path d="M -130 90 L -130 -40 A 130 130 0 0 1 130 -40 L 130 90" fill="none" stroke="#E5D9C8" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

    <!-- Small Table in between with Tea Cups (Calm Hospitality) -->
    <ellipse cx="0" cy="55" rx="36" ry="10" fill="#E8DEC9" />
    <path d="M -12 40 L -8 52 L 8 52 L 12 40 Z" fill="#FFFFFF" opacity="0.9" />
    <path d="M -3 36 C -3 30, 3 30, 3 24" fill="none" stroke="#D7C9B2" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

    <!-- Left Person: Serene, listening neighbour -->
    <g transform="translate(-75, 5)">
      <!-- Head -->
      <circle cx="0" cy="-35" r="22" fill="url(#personLeft)" />
      <!-- Torso: Elegant relaxed silhouette -->
      <path d="M -26 50 C -26 5, 26 5, 26 50 Z" fill="url(#personLeft)" opacity="0.9" />
    </g>

    <!-- Right Person: Friendly connector / affiliate -->
    <g transform="translate(75, 5)">
      <!-- Head -->
      <circle cx="0" cy="-35" r="22" fill="url(#personRight)" />
      <!-- Torso: Relaxed silhouette leaning in slightly -->
      <path d="M -26 50 C -26 5, 26 5, 26 50 Z" fill="url(#personRight)" opacity="0.9" />
    </g>

  </g>
</svg>
